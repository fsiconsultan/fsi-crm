<script>

let sessionToken = '';
let currentUser = null;

/* =========================
   LOGIN
========================= */

function login() {

  const username =
    document.getElementById('loginUsername').value.trim();

  const password =
    document.getElementById('loginPassword').value;

  if (!username || !password) {
    setLoginMessage('Username dan password wajib diisi.');

  setLoginMessage('Logging in...');

  google.script.run

      sessionToken = result.token;
      currentUser = result.user;

        'fsi_session',

      );

      showApp();

    })

      setLoginMessage(
        error.message || 'Login gagal.'
      );

    })
    .login(username, password);
}


/* =========================
   SESSION
========================= */

function checkSession() {

  const token =
    localStorage.getItem('fsi_session');

  if (!token) return;

  google.script.run
    .withSuccessHandler(function(user) {

      sessionToken = token;
      currentUser = user;

      showApp();

    })
    .withFailureHandler(function() {

      localStorage.removeItem('fsi_session');

    })
    .getCurrentUser(token);
}


function logout() {

  google.script.run
    .withSuccessHandler(function() {

      localStorage.removeItem('fsi_session');

      sessionToken = '';
      currentUser = null;

      document.getElementById('app').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';

      setLoginMessage('');

    })
    .withFailureHandler(function(error) {

      showError(error);

    })
    .logout(sessionToken);
}

function filterLeads() {

  const search =
    document.getElementById(
      'leadSearch'
    ).value
    .toLowerCase()
    .trim();

  const status =
    document.getElementById(
      'statusFilter'
    ).value;

  const filtered =
    allLeads.filter(function(lead) {

      const customer =
        String(lead.customer || '')
          .toLowerCase();

      const phone =
        String(lead.phone || '')
          .toLowerCase();

      const business =
        String(lead.business || '')
          .toLowerCase();

      const location =
        String(lead.location || '')
          .toLowerCase();

      const matchesSearch =
        !search ||
        customer.includes(search) ||
        phone.includes(search) ||
        business.includes(search) ||
        location.includes(search);

      const matchesStatus =
        !status ||
        lead.status === status;

      return matchesSearch && matchesStatus;

    });

  renderLeads(filtered);
}

/* =========================
   STATUS BADGE
========================= */

function getStatusBadge(status) {

  const value =
    String(status || 'New');

  const safeStatus =
    escapeHtml(value);

  const className =
    value
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9-]/g, '');

  return `
    <span class="status status-${className}">
      ${safeStatus}
    </span>
  `;
}


/* =========================
   PHONE CLEANUP
========================= */

function cleanPhone(phone) {

  let value =
    String(phone || '')
      .trim()
      .replace(/[^\d+]/g, '');

  if (!value) return '';

  if (value.startsWith('+62')) {
    value = value.substring(1);
  }

  if (value.startsWith('62')) {
    return value;
  }

  if (value.startsWith('0')) {
    return '62' + value.substring(1);
  }

  return value;
}


/* =========================
   DATE HELPERS
========================= */

function formatDateValue(value) {

  if (!value) return '-';

  const date =
    normalizeDateForInput(value);

  if (!date) {
    return escapeHtml(String(value));
  }

  const parts =
    date.split('-');

  if (parts.length !== 3) {
    return escapeHtml(String(value));
  }

  return (
    parts[2] +
    '/' +
    parts[1] +
    '/' +
    parts[0]
  );
}


function normalizeDateForInput(value) {

  if (!value) return '';

  if (
    typeof value === 'string' &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  ) {
    return value;
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return '';
  }

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, '0');

  const day =
    String(date.getDate())
      .padStart(2, '0');

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );
}

function showToast(
  message,
  type
) {

  let container =
    document.getElementById(
      'fsiToastContainer'
    );

  if (!container) {

    container =
      document.createElement('div');

    container.id =
      'fsiToastContainer';

    container.className =
      'toast-container';

    document.body.appendChild(container);
  }

  const toast =
    document.createElement('div');

  toast.className =
    'fsi-toast ' +
    (type || 'success');

  toast.innerHTML = `
    <span class="toast-icon">
      ${
        type === 'error'
          ? '!'
          : '✓'
      }
    </span>

    <span class="toast-message">
      ${escapeHtml(message)}
    </span>
  `;

  container.appendChild(toast);

  setTimeout(function() {

    toast.classList.add('show');

  }, 10);

  setTimeout(function() {

    toast.classList.remove('show');

    setTimeout(function() {

      toast.remove();

    }, 300);

  }, 3500);
}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return '';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeAttr(value) {

  return String(value || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
}
