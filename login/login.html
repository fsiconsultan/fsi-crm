<!-- =========================================================
     CRM FSI - LOGIN COMPONENT
     Tampilan khusus Login
     Tidak mengandung logic authentication
     ========================================================= -->

<section class="fsi-login-page" id="fsiLoginPage">

    <!-- Background -->
    <div class="fsi-login-background" aria-hidden="true"></div>

    <!-- Overlay -->
    <div class="fsi-login-overlay" aria-hidden="true"></div>

    <!-- Decorative light -->
    <div class="fsi-login-glow fsi-login-glow-one" aria-hidden="true"></div>
    <div class="fsi-login-glow fsi-login-glow-two" aria-hidden="true"></div>

    <!-- Login Card -->
    <div class="fsi-login-card">

        <!-- Logo -->
        <div class="fsi-login-brand">
            <div class="fsi-login-logo-wrap">
                <img
                    src="logo-fsi.png"
                    alt="FSI Consultant"
                    class="fsi-login-logo"
                >
            </div>
        </div>

        <!-- Heading -->
        <div class="fsi-login-heading">
            <h1>Welcome Back</h1>

            <p>
                Sign in to access your
                <strong>FSI CRM Consultant</strong>
            </p>
        </div>

        <!-- Login Form -->
        <form
            class="fsi-login-form"
            id="fsiLoginForm"
            autocomplete="on"
        >

            <!-- Username -->
            <div class="fsi-login-field">

                <label for="fsiLoginUsername">
                    Username
                </label>

                <div class="fsi-login-input-wrap">

                    <span
                        class="fsi-login-input-icon"
                        aria-hidden="true"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M20 21C20 17.6863 17.3137 15 14 15H10C6.68629 15 4 17.6863 4 21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />
                        </svg>
                    </span>

                    <input
                        type="text"
                        id="fsiLoginUsername"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                    >

                </div>
            </div>

            <!-- Password -->
            <div class="fsi-login-field">

                <label for="fsiLoginPassword">
                    Password
                </label>

                <div class="fsi-login-input-wrap">

                    <span
                        class="fsi-login-input-icon"
                        aria-hidden="true"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="fsiLoginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="fsi-login-password-toggle"
                        id="fsiPasswordToggle"
                        aria-label="Show password"
                    >
                        <svg
                            class="fsi-eye-open"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 18 18.5 12 18.5C6 18.5 2.5 12 2.5 12Z"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.8"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />
                        </svg>

                        <svg
                            class="fsi-eye-closed"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M3 3L21 21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M10.7 5.7C11.12 5.57 11.55 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 20.35 14.13 18.35 15.9"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />

                            <path
                                d="M6.15 6.15C3.65 8.25 2.5 12 2.5 12C2.5 12 6 18.5 12 18.5C13.55 18.5 14.95 18.05 16.2 17.4"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                </div>
            </div>

            <!-- Remember + Forgot -->
            <div class="fsi-login-options">

                <label class="fsi-login-remember">

                    <input
                        type="checkbox"
                        id="fsiRememberMe"
                        name="remember"
                    >

                    <span class="fsi-login-checkmark"></span>

                    <span>Remember me</span>

                </label>

                <button
                    type="button"
                    class="fsi-login-forgot"
                    id="fsiForgotPassword"
                >
                    Forgot password?
                </button>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="fsi-login-button"
                id="fsiLoginButton"
            >

                <span class="fsi-login-button-text">
                    LOGIN
                </span>

                <span
                    class="fsi-login-button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>

            <!-- Login Error / Message -->
            <div
                class="fsi-login-message"
                id="fsiLoginMessage"
                role="alert"
                aria-live="polite"
            ></div>

        </form>

        <!-- Admin Help -->
        <div class="fsi-login-help">

            <div class="fsi-login-help-icon">
                ?
            </div>

            <div class="fsi-login-help-text">

                <strong>Need help signing in?</strong>

                <span>
                    Forgot your password?
                    Please contact your Admin.
                </span>

            </div>

        </div>

        <!-- Security -->
        <div class="fsi-login-security">

            <span class="fsi-security-lock">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="11"
                        rx="2"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />

                    <path
                        d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    />
                </svg>
            </span>

            <span>
                Secure CRM Access
            </span>

            <span class="fsi-security-dot"></span>

            <span>
                FSI Consultant
            </span>

        </div>

    </div>

    <!-- Footer -->
    <div class="fsi-login-footer">
        FSI Consultant CRM
    </div>

</section>


<!-- =========================================================
     LOGIN VISUAL SCRIPT
     Hanya untuk efek tampilan password.
     Authentication tetap di script.js utama.
     ========================================================= -->

<script>
(function () {

    const passwordInput =
        document.getElementById("fsiLoginPassword");

    const toggleButton =
        document.getElementById("fsiPasswordToggle");

    if (!passwordInput || !toggleButton) {
        return;
    }

    toggleButton.addEventListener("click", function () {

        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword ? "text" : "password";

        toggleButton.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

        toggleButton.classList.toggle(
            "show-password",
            isPassword
        );

    });

})();
</script>
