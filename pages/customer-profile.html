<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="FSI CRM - French Solar Industry"
  >

  <meta
    name="theme-color"
    content="#0b63ce"
  >

  <title>Customer Profile | FSI CRM</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- CRM CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

  <div id="app" class="app">

    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main class="main-content">

      <!-- ================================
           TOP HEADER
      ================================= -->

      <header class="top-header">

        <div class="header-left">

          <div class="brand-area">
            <a href="dashboard.html" class="brand-logo">
              <img
                src="../assets/logo-fsi.png"
                alt="FSI CRM"
              >
            </a>

            <div class="brand-text">
              <strong>FSI CRM</strong>
              <span>French Solar Industry</span>
            </div>
          </div>

          <div class="page-heading">
            <h1 id="pageTitle">
              Customer Profile
            </h1>

            <p id="pageSubtitle">
              Detail pelanggan dan progress sales
            </p>
          </div>

        </div>

        <!-- HEADER RIGHT -->

        <div class="header-right">

          <!-- Navigation -->

          <nav class="top-navigation">

            <a
              class="top-nav-item"
              href="dashboard.html"
            >
              <i class="fa-solid fa-chart-pie"></i>
              <span>Dashboard</span>
            </a>

            <a
              class="top-nav-item active"
              href="leads.html"
            >
              <i class="fa-solid fa-users"></i>
              <span>Leads</span>
            </a>

            <a
              class="top-nav-item admin-only"
              href="sales.html"
            >
              <i class="fa-solid fa-user-tie"></i>
              <span>Manage Sales</span>
            </a>

          </nav>

          <!-- Global Search -->

          <div class="global-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              id="globalSearch"
              type="search"
              placeholder="Cari leads, pelanggan, atau nama..."
              autocomplete="off"
            >

          </div>

          <!-- Notification -->

          <button
            class="header-icon-btn"
            type="button"
            title="Notifications"
          >
            <i class="fa-regular fa-bell"></i>
          </button>

          <!-- User Menu -->

          <div class="user-menu-wrapper">

            <button
              id="userMenu"
              class="user-menu"
              type="button"
            >

              <span
                id="userAvatarInitial"
                class="user-avatar"
              >
                F
              </span>

              <span
                id="userInfo"
                class="user-info"
              >
                <strong>User</strong>
                <small>Sales</small>
              </span>

              <i class="fa-solid fa-chevron-down"></i>

            </button>

            <!-- User Dropdown -->

            <div
              id="userDropdown"
              class="user-dropdown"
              style="display: none;"
            >

              <button
                type="button"
                onclick="openProfileModal()"
              >
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
              </button>

              <div class="dropdown-divider"></div>

              <button
                id="dropdownLogout"
                class="danger"
                type="button"
              >
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
              </button>

            </div>

          </div>

        </div>

      </header>


      <!-- ================================
           PAGE CONTENT
      ================================= -->

      <section class="page-content">

        <section
          id="customerProfilePage"
          class="page"
        >

          <div id="customerProfileContent">

            <div class="profile-loading">

              <i class="fa-solid fa-spinner fa-spin"></i>

              <span>
                Loading customer...
              </span>

            </div>

          </div>

        </section>

      </section>

    </main>

  </div>


  <!-- ================================
       CONFIRM MODAL
  ================================= -->

  <div
    id="confirmModal"
    class="modal-overlay"
    style="display: none;"
  >

    <div class="modal modal-small">

      <div class="confirm-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <h2 id="confirmTitle">
        Confirm
      </h2>

      <p id="confirmMessage"></p>

      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          type="button"
          data-close="confirmModal"
        >
          Cancel
        </button>

        <button
          id="confirmActionBtn"
          class="btn btn-danger"
          type="button"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>


  <!-- ================================
       PROFILE MODAL
  ================================= -->

  <div
    id="profileModal"
    class="modal-overlay"
    style="display: none;"
  >

    <div class="modal">

      <div class="modal-header">

        <div>

          <h2>
            My Profile
          </h2>

          <p>
            Informasi akun pengguna CRM.
          </p>

        </div>

        <button
          class="modal-close"
          type="button"
          data-close="profileModal"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <div
        id="userProfileContent"
        class="profile-card"
      ></div>

    </div>

  </div>


  <!-- ================================
       TOAST
  ================================= -->

  <div
    id="toastContainer"
    class="toast-container"
  ></div>


  <!-- ================================
       GLOBAL LOADING
  ================================= -->

  <div
    id="globalLoading"
    class="global-loading"
    style="display: none;"
  >

    <div>

      <i class="fa-solid fa-spinner fa-spin"></i>

      <span id="globalLoadingText">
        Loading...
      </span>

    </div>

  </div>


  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../js/config.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/leads.js"></script>
  <script src="../js/customer-profile.js"></script>
  <script src="../js/sales.js"></script>

</body>
</html>
