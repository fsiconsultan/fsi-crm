<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="FSI CRM - Customer Profile"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>View Customer | FSI CRM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/leads.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/sales.css">

</head>

<body>

<div id="app" class="app">

  <main class="main-content">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

      <div class="header-left">

        <a
          href="dashboard.html"
          class="brand-area"
          aria-label="FSI CRM Dashboard"
        >

          <img
            src="../assets/logo-fsi.png"
            alt="FSI Logo"
            class="brand-logo"
          >

          <div class="brand-text">
            <strong>FSI CRM</strong>
            <span>French Solar Industry</span>
          </div>

        </a>


        <div class="page-heading">

          <h1>Customer</h1>

          <p>
            CRM French Solar Industry
          </p>

        </div>

      </div>


      <div class="header-right">

        <!-- ADMIN SALES -->

        <div
          id="adminSalesHeader"
          class="admin-sales-header admin-only"
          style="display:none;"
        >

          <label for="adminSalesSelect">
            Sales
          </label>

          <div class="admin-sales-select-wrap">

            <select id="adminSalesSelect">

              <option value="">
                All Sales
              </option>

            </select>

          </div>

        </div>


        <!-- NAV -->

        <nav class="top-navigation">

          <a
            href="dashboard.html"
            class="top-nav-item"
          >
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
          </a>


          <a
            href="leads.html"
            class="top-nav-item active"
          >
            <i class="fa-solid fa-users"></i>
            <span>Leads</span>
          </a>

        </nav>


        <!-- USER -->

        <div class="user-menu-wrapper">

          <button
            id="userMenu"
            class="user-menu"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >

            <span
              id="userAvatarInitial"
              class="user-avatar"
            >
              F
            </span>

            <span
              id="userInfo"
              class="user-info"
            >
              <strong>User</strong>
              <small>Sales</small>
            </span>

            <i class="fa-solid fa-chevron-down"></i>

          </button>


          <div
            id="userDropdown"
            class="user-dropdown"
            style="display:none;"
          >

            <button
              id="profileBtn"
              type="button"
              onclick="openProfileModal()"
            >

              <i class="fa-solid fa-user"></i>
              <span>Profile</span>

            </button>


            <div class="dropdown-divider"></div>


            <button
              id="dropdownLogout"
              class="danger"
              type="button"
            >

              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Logout</span>

            </button>

          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================
         CUSTOMER PROFILE
    ====================================================== -->

    <section class="page-content customer-profile-page">

      <div class="customer-profile-container">

        <div class="profile-page-top">

          <button
            type="button"
            class="profile-back-btn"
            onclick="window.location.href='leads.html'"
          >
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Leads</span>
          </button>


          <div class="profile-page-title">

            <div class="profile-page-icon">
              <i class="fa-solid fa-user"></i>
            </div>

            <div>

              <div class="profile-breadcrumb">
                CRM
                <i class="fa-solid fa-chevron-right"></i>
                Customer
              </div>

              <h1>
                View Customer
              </h1>

              <p>
                Detail informasi dan sales pipeline customer.
              </p>

            </div>

          </div>

        </div>


        <!-- CONTENT DIISI customer-profile.js -->

        <div
          id="customerProfileContent"
          class="customer-profile-content"
        >

          <div class="profile-loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <span>
              Loading customer...
            </span>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- =====================================================
     PROFILE MODAL
====================================================== -->

<div
  id="profileModal"
  class="modal-overlay"
  style="display:none;"
>

  <div
    class="modal profile-modal-container"
    role="dialog"
    aria-modal="true"
  >

    <div class="modal-header">

      <div>

        <h2>
          My Profile
        </h2>

        <p>
          Informasi akun pengguna CRM.
        </p>

      </div>


      <button
        class="modal-close"
        type="button"
        data-close-modal="profileModal"
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>


    <div
      id="userProfileContent"
      class="profile-modal-content"
    ></div>

  </div>

</div>


<!-- TOAST -->

<div
  id="toastContainer"
  class="toast-container"
></div>


<!-- LOADING -->

<div
  id="globalLoading"
  class="global-loading"
  style="display:none;"
>

  <div>

    <i class="fa-solid fa-spinner fa-spin"></i>

    <span id="globalLoadingText">
      Loading...
    </span>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/helpers.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/customer-profile.js"></script>

</body>
</html>
