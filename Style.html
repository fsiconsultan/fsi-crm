<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #1f2937;
}


/* LOGIN */

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  width: 360px;
  background: white;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.logo {
  width: 55px;
  height: 55px;
  border-radius: 12px;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.login-box h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #6b7280;
  margin-top: 0;
  margin-bottom: 25px;
}


/* INPUT */

input,
select,
textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  margin-bottom: 13px;
  font-size: 14px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 5px;
}


/* BUTTON */

button {
  border: 0;
  cursor: pointer;
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 13px;
}

.primary-btn {
  background: #111827;
  color: white;
}

.primary-btn:hover {
  opacity: .9;
}

.secondary-btn {
  background: #e5e7eb;
  color: #111827;
}

.logout-btn {
  background: transparent;
  color: white;
  text-align: left;
  width: 100%;
}


/* APP */

#app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 230px;
  background: #111827;
  color: white;
  padding: 20px;
  position: fixed;
  top: 0;
  bottom: 0;
}

.brand {
  font-size: 20px;
  margin-bottom: 30px;
}

.user-info {
  background: rgba(255,255,255,.08);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 13px;
}

.sidebar nav button {
  width: 100%;
  background: transparent;
  color: white;
  text-align: left;
  margin-bottom: 5px;
}

.sidebar nav button:hover {
  background: rgba(255,255,255,.1);
}

.logout-btn {
  position: absolute;
  bottom: 20px;
}


/* MAIN */

.main {
  margin-left: 230px;
  width: calc(100% - 230px);
}

.topbar {
  background: white;
  padding: 20px 25px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
}

.topbar h2 {
  margin: 0;
}

.content {
  padding: 25px;
}


/* STATS */

.stats-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(170px, 1fr));

  gap: 15px;
}

.stat-card {
  background: white;
  border-radius: 10px;
  padding: 20px;
  border: 1px solid #e5e7eb;
}

.stat-card span {
  color: #6b7280;
  font-size: 13px;
}

.stat-card strong {
  display: block;
  font-size: 28px;
  margin-top: 8px;
}


/* TOOLBAR */

.toolbar {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.toolbar input {
  margin: 0;
  max-width: 300px;
}

.toolbar select {
  margin: 0;
  max-width: 180px;
}


/* TABLE */

.table-wrapper {
  overflow-x: auto;
  background: white;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 13px;
}

th {
  background: #f9fafb;
  font-weight: 600;
}

.status {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 20px;
  background: #eef2ff;
  font-size: 11px;
}


/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-box {
  background: white;
  width: 500px;
  max-width: 94%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 25px;
  border-radius: 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 15px;
}

.message {
  margin-top: 15px;
  font-size: 13px;
}


/* MOBILE */

@media (max-width: 700px) {

  .sidebar {
    width: 70px;
    padding: 10px;
  }

  .brand {
    font-size: 12px;
  }

  .user-info {
    display: none;
  }

  .sidebar nav button {
    font-size: 0;
  }

  .main {
    margin-left: 70px;
    width: calc(100% - 70px);
  }

  .content {
    padding: 15px;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .toolbar input,
  .toolbar select {
    max-width: 100%;
  }
}

</style>
